name: Bug report
description: Report a reproducible non-sensitive bug
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security vulnerabilities or real sensitive reports.
        For vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use synthetic data only.
      placeholder: Minimal steps to reproduce...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / version
      placeholder: Commit SHA or branch
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I did not include real reporter data, credentials, secrets, or identifying victim information.
          required: true
        - label: This is not an exploitable security vulnerability that should be reported privately.
          required: true
