version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Routine version updates are disabled. Repository-level Dependabot
    # security updates remain enabled and are not subject to this limit.
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Keep GitHub Actions on reviewed pins unless a security advisory requires
    # an update.
    open-pull-requests-limit: 0
    labels:
      - dependencies
